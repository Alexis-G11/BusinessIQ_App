name: BusinessIQ CI

permissions:
  contents: read

on:
  push:
    branches: [main, codex/businessiq-development]
  pull_request:
    branches: [main]

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt
      - run: python -m pip install -r apps/backend/requirements-dev.txt
      - run: python -m pytest apps/backend/tests

  expo-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    env:
      # Build-only placeholders. These do not indicate that external services are configured.
      EXPO_PUBLIC_API_URL: http://127.0.0.1:8000
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web

  legacy-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/legacy-web
    env:
      # Build-only placeholders; retain the legacy app until replacement parity is verified.
      VITE_API_URL: http://127.0.0.1:8000
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: build-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/legacy-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
